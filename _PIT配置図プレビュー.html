<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIT配置図 プレビュー（モック）</title>
<style>
  /* PitFlow と同じテーマ変数（ダーク）。実アプリの base.css 相当を最低限だけ。 */
  :root{
    --bg:#0e1116; --bg2:#161a22; --bg3:#1e2530;
    --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.18);
    --text:#e6e9ef; --text2:#9aa6b6; --text3:#6b7686;
    --green:#1db97a; --red:#ef4444; --brand:#1db97a;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",sans-serif; }
  .mock-bar{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); background:var(--bg2); flex-wrap:wrap; }
  .mock-bar b{ font-size:15px; }
  .mock-bar .note{ font-size:12px; color:var(--text3); }
  .vh-btn{ font-family:inherit; background:var(--bg3); color:var(--text2); border:1px solid var(--border); border-radius:8px; padding:8px 13px; font-size:13px; cursor:pointer; }
  .vh-btn:hover{ color:var(--text); }
  .vh-btn.primary{ background:var(--green); color:#fff; border-color:var(--green); }
</style>
<link rel="stylesheet" href="css/floor.css">
</head>
<body>
  <div class="mock-bar">
    <b>🏭 PIT配置図 プレビュー</b>
    <button class="vh-btn primary" onclick="PitFloorEditor.open()">エディタを開く</button>
    <span class="note">※これは確認用モック。実アプリの js/pit-floor.js・css/floor.css をそのまま読み込んでいます（編集内容は保存されません／pushは不要）。変更したらこのページを再読み込み。</span>
  </div>

  <script>
    /* 実アプリの依存（state / PitDB / renderSettings）をモック用にスタブ。
       ※モックでも localStorage に保存して、再読み込みしても配置が残るようにする（このブラウザ内のみ）。 */
    var MOCK_KEY = 'pitfloor_mock_v1';
    window.state = { bays: [], floorPlan: { cols: 22, rows: 14, shapes: [] }, settings: {}, currentView: 'mock' };
    window.PitDB = {
      save: function () {
        try { localStorage.setItem(MOCK_KEY, JSON.stringify({ bays: window.state.bays, floorPlan: window.state.floorPlan })); } catch (e) {}
      }
    };
    window.renderSettings = function () { };

    (function init() {
      /* 保存済みがあればそれを採用＝続きから編集できる */
      try {
        var raw = localStorage.getItem(MOCK_KEY);
        if (raw) { var d = JSON.parse(raw); if (Array.isArray(d.bays)) { window.state.bays = d.bays; if (d.floorPlan) window.state.floorPlan = d.floorPlan; return; } }
      } catch (e) {}
      /* 無ければサンプル工場を初期表示 */
      var W = 22, H = 14, m = 0.4;
      window.state.floorPlan = {
        cols: W, rows: H, shapes: [
          { id: 'w_top', type: 'wall', x1: m, y1: m, x2: W - m, y2: m },
          { id: 'w_bot', type: 'wall', x1: m, y1: H - m, x2: W - m, y2: H - m },
          { id: 'w_left', type: 'wall', x1: m, y1: m, x2: m, y2: H - m },
          { id: 'w_right', type: 'wall', x1: W - m, y1: m, x2: W - m, y2: H - m },
          { id: 'sh_in', type: 'shutter', wallId: 'w_bot', t: 0.46 }
        ]
      };
      var xs = [2, 6.5, 11, 15.5], list = [];
      xs.forEach(function (x, i) { list.push({ id: 'b' + i, name: (i === 3 ? 'リフト' : 'PIT ' + (i + 1)), icon: '', kind: (i === 3 ? 'lift' : 'flat'), division: 'div1', gx: x, gy: 1.5, gw: 3, gh: 5 }); });
      xs.forEach(function (x, i) { list.push({ id: 'c' + i, name: (i === 0 ? 'リフト' : 'PIT ' + (i + 4)), icon: '', kind: (i === 0 ? 'lift' : 'flat'), division: 'div2', gx: x, gy: 8, gw: 3, gh: 5 }); });
      window.state.bays = list;
    })();
  </script>

  <!-- 実アプリのエディタ本体をそのまま読み込む -->
  <script src="js/pit-floor.js"></script>

  <script>
    /* 読み込み後、自動でエディタを開く */
    window.addEventListener('load', function () {
      try { PitFloorEditor.open(); } catch (e) { console.error(e); alert('エディタの起動に失敗: ' + e.message); }
    });
  </script>
</body>
</html>
