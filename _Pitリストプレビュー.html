<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitリスト プレビュー（モック）</title>
<style>
  :root{
    --bg:#0e1116; --bg2:#161a22; --bg3:#1e2530;
    --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.18);
    --text:#e6e9ef; --text2:#9aa6b6; --text3:#6b7686;
    --green:#1db97a; --red:#ef4444; --brand:#1db97a;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",sans-serif; }
  .mock-bar{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); background:var(--bg2); flex-wrap:wrap; }
  .mock-bar b{ font-size:15px; }
  .mock-bar .note{ font-size:12px; color:var(--text3); flex:1 1 100%; }
  .vh-btn{ font-family:inherit; background:var(--bg3); color:var(--text2); border:1px solid var(--border); border-radius:8px; padding:8px 13px; font-size:13px; cursor:pointer; }
  .vh-btn:hover{ color:var(--text); }
  .vh-btn.primary{ background:var(--green); color:#fff; border-color:var(--green); }
  .wrap{ padding:18px; }
  .view-title{ font-size:15px; font-weight:700; margin-bottom:10px; }
</style>
<link rel="stylesheet" href="css/floor.css">
</head>
<body>
  <div class="mock-bar">
    <b>🏭 Pitリスト プレビュー</b>
    <button class="vh-btn primary" onclick="PitFloorEditor.open()">配置図を編集</button>
    <button class="vh-btn" onclick="PitPip.toggle()">🏭 Pit配置（PiP小窓）</button>
    <button class="vh-btn" onclick="renderMock()">🔄 再描画</button>
    <span class="note">確認用モック。実アプリの js/pit-floor.js・js/dnd.js・js/pit-pip.js・css/floor.css をそのまま読み込み（自社PIT配置図＋サンプルカード）。カードを枠へドラッグ／別の枠へ移動／下のトレイ↔枠で配置を試せます。保存されません。</span>
  </div>

  <div class="wrap">
    <div class="view-title">🏭 Pitリスト（PIT配置図に実際のカードをはめる）</div>
    <div id="pitlist-stage" class="pitlist-stage"><div id="pitlist-grid" class="pf-grid pfv-grid"></div></div>
    <div id="pitlist-unassigned" class="pitlist-unassigned"></div>
  </div>

  <script>
    /* ===== 自社PIT配置図（バックアップJSONの中身を埋め込み） ===== */
    var FLOOR = {
      bays: [
        { id:"baymq99q0w9862", name:"3PIT", icon:"", kind:"lift", division:"div2", gx:1.5, gy:6, gw:3, gh:5, dir:"v", ncol:1, rows:5 },
        { id:"baymq99qi0p112", name:"2番", icon:"", kind:"lift", division:"div1", gx:6, gy:6, gw:3, gh:5, dir:"v", ncol:1, rows:5 },
        { id:"baymq99qve324", name:"1PIT", icon:"", kind:"lift", division:"div1", gx:10.5, gy:6, gw:3, gh:5, dir:"v", ncol:1, rows:5 },
        { id:"baymq9gfkf8184", name:"PIT 4", icon:"", kind:"flat", division:"", dir:"h", ncol:2, rows:2, gx:1.5, gy:13 },
        { id:"baymq9gftkt76", name:"4PIT", icon:"", kind:"lift", division:"div2", dir:"h", ncol:2, rows:2, gx:8.5, gy:13 },
        { id:"baymq9gitve44", name:"3前（青空1番）", icon:"", kind:"flat", division:"", dir:"h", ncol:2, rows:2, gx:1, gy:2 },
        { id:"baymq9gj24g50", name:"1前", icon:"", kind:"flat", division:"", dir:"h", ncol:2, rows:2, gx:7.5, gy:2 }
      ],
      floorPlan: { cols:30, rows:18, shapes:[
        { id:"shmq9gg71m912", type:"building", gx:0.5, gy:5, gw:15, gh:12, locked:true },
        { id:"shmq9ghc5t866", type:"door", t:0.5833, hostKind:"bld", hostId:"shmq9gg71m912", edge:1, doorDir:"out", doorSide:"r" },
        { id:"shmq9ghr8j107", type:"shutter", t:0.2182, hostKind:"bld", hostId:"shmq9gg71m912", edge:3, len:3.2 },
        { id:"shmq9gi2h482", type:"shutter", t:0.2152, hostKind:"bld", hostId:"shmq9gg71m912", edge:0, len:5.6 },
        { id:"shmq9gibiy991", type:"shutter", t:0.7024, hostKind:"bld", hostId:"shmq9gg71m912", edge:0, len:5.6 }
      ]}
    };
    /* サンプルカード（bayId で枠に割当・3件は未割当） */
    var CARDS = [
      { id:"k1", status:"work",  boardId:"default", bayId:"baymq99qve324", customer:"田中", car:"プリウス" },
      { id:"k2", status:"check", boardId:"default", bayId:"baymq99qve324", customer:"佐藤", car:"アクア" },
      { id:"k3", status:"work",  boardId:"import",  bayId:"baymq99q0w9862", customer:"鈴木", car:"BMW 320i" },
      { id:"k4", status:"parts", boardId:"default", bayId:"baymq99qi0p112", customer:"高橋", car:"ヴィッツ" },
      { id:"k5", status:"work",  boardId:"import",  bayId:"baymq9gftkt76", customer:"伊藤", car:"ベンツ C200" },
      { id:"k6", status:"estim", boardId:"default", bayId:"baymq9gj24g50", customer:"渡辺", car:"ノート" },
      { id:"k7", status:"work",  boardId:"default", bayId:null, customer:"山本", car:"フィット" },
      { id:"k8", status:"check", boardId:"import",  bayId:null, customer:"中村", car:"アウディ A4" },
      { id:"k9", status:"work",  boardId:"default", bayId:null, customer:"小林", car:"ヤリス" }
    ];

    window.state = {
      bays: FLOOR.bays, floorPlan: FLOOR.floorPlan, cards: CARDS,
      settings:{}, currentView:'work'
    };
    window.PitDB = { save:function(){} };
    window.renderSettings = function(){};
    window.openDetail = function(id){ var c = state.cards.find(function(x){return x.id===id;}); alert('カード詳細（モック）：' + (c? (c.customer+' / '+c.car) : id)); };
    /* dnd.js が呼ぶ showView → モックでは Pitリストを再描画 */
    window.showView = function(){ renderMock(); };

    var WORK_STATUSES = ['check','estim','contact','parts','work'];
    function cardChip(c){
      var team = (c.boardId==='import') ? '#ec4899' : '#1db97a';
      return '<span class="pfv-card" draggable="true" data-card-id="'+c.id+'" onclick="openDetail(\''+c.id+'\')" '+
        'style="width:150px;height:38px;border-left-color:'+team+'">'+
        '<b class="pfv-cn">'+c.customer+'</b><span class="pfv-cc">'+c.car+'</span></span>';
    }
    function renderMock(){
      var grid = document.getElementById('pitlist-grid');
      var stage = document.getElementById('pitlist-stage');
      var targets = state.cards.filter(function(c){ return WORK_STATUSES.indexOf(c.status)>=0; });
      var byBay = {};
      targets.forEach(function(c){ if(c.bayId){ (byBay[c.bayId]=byBay[c.bayId]||[]).push(c); } });
      PitFloorView.render(grid, { cardsByBay: byBay, stage: stage });
      var un = targets.filter(function(c){ return !c.bayId; });
      var tray = document.getElementById('pitlist-unassigned');
      var h = '<div class="pitlist-tray-head"><span>📥 未割当（PIT枠未指定）</span><span class="pitlist-tray-meta">'+un.length+' 件・ドラッグで枠へ</span></div>';
      h += '<div class="pitlist-tray-body" data-drop="bay" data-drop-val="">'+ un.map(cardChip).join('') +'</div>';
      tray.innerHTML = h;
      if(window.PitPip && PitPip.isOpen && PitPip.isOpen()) PitPip.refresh();
    }
    window.renderMock = renderMock;
  </script>

  <script src="js/pit-floor.js"></script>
  <script src="js/dnd.js"></script>
  <script src="js/pit-pip.js"></script>
  <script>
    window.addEventListener('load', function(){
      try { renderMock(); } catch(e){ console.error(e); alert('描画に失敗: ' + e.message); }
    });
  </script>
</body>
</html>
